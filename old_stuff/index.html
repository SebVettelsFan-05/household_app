<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EE">
  <title>My Fridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF6EE;
      --surface: #FFFFFF;
      --surface-soft: #F2EDE0;
      --ink: #1B2820;
      --ink-soft: #5A6B61;
      --accent: #2D4A3E;
      --accent-soft: #DCE7E0;
      --warn: #C75B3B;
      --danger: #A8362A;
      --line: rgba(27, 40, 32, 0.10);
      --shadow: 0 1px 2px rgba(27, 40, 32, 0.04), 0 4px 12px rgba(27, 40, 32, 0.06);
      --radius: 14px;
      --cat-meat: #B8543D;
      --cat-meat-soft: #F1DDD4;
      --cat-veggies: #6E8E5C;
      --cat-veggies-soft: #DEE8D3;
      --cat-other: #8B8278;
      --cat-other-soft: #E8E3DB;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      font-size: 16px; line-height: 1.4;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 80px; }
    header {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 12px; padding: 8px 4px 20px;
      border-bottom: 1px solid var(--line); margin-bottom: 18px;
    }
    h1 {
      font-family: 'Fraunces', serif; font-weight: 600;
      font-size: 38px; letter-spacing: -0.02em; margin: 0;
      font-variation-settings: "opsz" 144, "SOFT" 50;
    }
    .stats { text-align: right; font-size: 13px; color: var(--ink-soft); line-height: 1.3; padding-bottom: 4px; }
    .stats strong { color: var(--ink); font-weight: 600; }

    .add-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
      border: 1px solid var(--line); margin-bottom: 22px;
    }
    .add-card h2 {
      font-family: 'Fraunces', serif; font-weight: 500;
      font-size: 18px; margin: 0 0 12px; letter-spacing: -0.01em;
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 12px; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-soft); margin-bottom: 6px;
    }
    .field input {
      width: 100%; background: var(--bg); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px;
      font-family: inherit; font-size: 16px; color: var(--ink);
      transition: border-color 0.15s, background 0.15s;
    }
    .field input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-row .field { margin-bottom: 0; }

    .cat-pills { display: flex; gap: 6px; }
    .cat-pill {
      flex: 1; padding: 10px 8px;
      background: var(--bg); border: 1px solid var(--line);
      border-radius: 10px; font-family: inherit;
      font-size: 14px; font-weight: 500; color: var(--ink-soft);
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .cat-pill::before {
      content: ''; width: 8px; height: 8px;
      border-radius: 50%; background: currentColor; opacity: 0.5;
    }
    .cat-pill[data-cat="Meat"] { color: var(--cat-meat); }
    .cat-pill[data-cat="Veggies"] { color: var(--cat-veggies); }
    .cat-pill[data-cat="Other"] { color: var(--cat-other); }
    .cat-pill.active { border-color: currentColor; background: var(--surface); font-weight: 600; }
    .cat-pill.active::before { opacity: 1; }
    .cat-pill[data-cat="Meat"].active { background: var(--cat-meat-soft); }
    .cat-pill[data-cat="Veggies"].active { background: var(--cat-veggies-soft); }
    .cat-pill[data-cat="Other"].active { background: var(--cat-other-soft); }

    button {
      font-family: inherit; cursor: pointer; border: none;
      transition: transform 0.05s, opacity 0.15s, background 0.15s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      width: 100%; background: var(--accent); color: #fff;
      padding: 14px; border-radius: 10px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin-top: 14px;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface-soft); color: var(--ink);
      padding: 10px 14px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
    }
    .btn-danger {
      background: transparent; color: var(--danger);
      padding: 10px 14px; border-radius: 8px;
      font-size: 14px; font-weight: 500;
    }

    .list-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 6px 4px 10px;
    }
    .list-head h2 {
      font-family: 'Fraunces', serif; font-weight: 500;
      font-size: 22px; margin: 0; letter-spacing: -0.01em;
    }
    .sort-toggle {
      background: none; border: none; color: var(--ink-soft);
      font-size: 13px; padding: 4px 8px;
      border-radius: 6px; font-family: inherit;
    }
    .sort-toggle:hover { background: var(--surface-soft); }

    .filter-row {
      display: flex; gap: 6px; margin: 0 0 12px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      background: var(--surface); border: 1px solid var(--line);
      color: var(--ink-soft); padding: 7px 14px;
      border-radius: 999px; font-family: inherit;
      font-size: 13px; font-weight: 500; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .filter-pill .dot-cat { width: 7px; height: 7px; border-radius: 50%; }
    .filter-pill[data-filter="Meat"] .dot-cat { background: var(--cat-meat); }
    .filter-pill[data-filter="Veggies"] .dot-cat { background: var(--cat-veggies); }
    .filter-pill[data-filter="Other"] .dot-cat { background: var(--cat-other); }
    .filter-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .items { display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; box-shadow: var(--shadow);
      cursor: pointer; position: relative; overflow: hidden;
    }
    .item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent-soft);
    }
    .item.expiring::before { background: var(--warn); }
    .item.expired::before { background: var(--danger); }
    .item:active { background: var(--surface-soft); }
    .item-main { flex: 1; min-width: 0; }
    .item-name {
      font-weight: 600; font-size: 16px; color: var(--ink); margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-meta {
      font-size: 13px; color: var(--ink-soft);
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .item-meta .cat-tag { font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .item-meta .cat-tag::before {
      content: ''; width: 7px; height: 7px;
      border-radius: 50%; background: currentColor;
    }
    .cat-Meat { color: var(--cat-meat); }
    .cat-Veggies { color: var(--cat-veggies); }
    .cat-Other { color: var(--cat-other); }
    .item.expiring .item-meta .expiry { color: var(--warn); font-weight: 500; }
    .item.expired .item-meta .expiry { color: var(--danger); font-weight: 600; }
    .dot { width: 3px; height: 3px; background: var(--ink-soft); border-radius: 50%; opacity: 0.5; }
    .item-qty {
      font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500;
      color: var(--ink); letter-spacing: -0.01em; white-space: nowrap;
    }
    .item-qty span {
      font-size: 12px; color: var(--ink-soft);
      font-family: 'DM Sans', sans-serif; font-weight: 500; margin-left: 2px;
    }
    .item-chev {
      color: var(--ink-soft); font-size: 22px; line-height: 1;
      opacity: 0.4; margin-left: 2px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .item:active .item-chev { opacity: 0.9; transform: translateX(2px); }
    .list-hint { font-size: 12px; color: var(--ink-soft); margin: -4px 4px 12px; font-style: italic; opacity: 0.8; }

    .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
    .empty .icon { font-size: 44px; margin-bottom: 12px; font-family: 'Fraunces', serif; }
    .empty p { margin: 4px 0; }

    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(27, 40, 32, 0.4);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
    }
    .modal-bg.open { display: flex; animation: fadeIn 0.15s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal {
      background: var(--bg); width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
      animation: slideUp 0.2s ease-out;
    }
    @media (min-width: 520px) {
      .modal-bg { align-items: center; padding: 20px; }
      .modal { border-radius: 20px; }
    }
    .modal h2 {
      font-family: 'Fraunces', serif; font-weight: 500;
      font-size: 22px; margin: 0 0 14px; letter-spacing: -0.01em;
    }
    .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
    .modal-actions .right { display: flex; gap: 8px; }

    .toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--bg);
      padding: 10px 16px; border-radius: 999px;
      font-size: 14px; max-width: 90%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .loading { text-align: center; padding: 40px; color: var(--ink-soft); font-size: 14px; }
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid var(--accent-soft); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .config-error {
      background: var(--cat-meat-soft); border: 1px solid var(--cat-meat);
      color: var(--cat-meat); padding: 16px; border-radius: 12px;
      margin: 16px 0; font-size: 14px; line-height: 1.5;
    }
    .config-error code {
      background: rgba(0,0,0,0.06); padding: 2px 6px;
      border-radius: 4px; font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Fridge</h1>
      <div class="stats" id="stats">
        <div><strong id="count">0</strong> items</div>
        <div id="totalLine"><strong>0</strong> g total</div>
      </div>
    </header>

    <section class="add-card">
      <h2>Add item</h2>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="e.g. Chicken breast" autocomplete="off">
      </div>
      <div class="field">
        <label>Category</label>
        <div class="cat-pills" id="addCats">
          <button type="button" class="cat-pill" data-cat="Meat">Meat</button>
          <button type="button" class="cat-pill" data-cat="Veggies">Veggies</button>
          <button type="button" class="cat-pill active" data-cat="Other">Other</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="qty">Quantity (g)</label>
          <input type="number" id="qty" inputmode="numeric" min="0" placeholder="500">
        </div>
        <div class="field">
          <label for="exp">Expiry (optional)</label>
          <input type="date" id="exp">
        </div>
      </div>
      <button class="btn-primary" id="addBtn">Add to fridge</button>
    </section>

    <div class="list-head">
      <h2>In the fridge</h2>
      <button class="sort-toggle" id="sortBtn">Sort: newest</button>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="Meat"><span class="dot-cat"></span>Meat</button>
      <button class="filter-pill" data-filter="Veggies"><span class="dot-cat"></span>Veggies</button>
      <button class="filter-pill" data-filter="Other"><span class="dot-cat"></span>Other</button>
    </div>
    <div class="list-hint">Tap any item to edit or delete</div>

    <div id="content">
      <div class="loading"><span class="spinner"></span>Loading…</div>
    </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>Edit item</h2>
      <div class="field">
        <label for="edit-name">Name</label>
        <input type="text" id="edit-name">
      </div>
      <div class="field">
        <label>Category</label>
        <div class="cat-pills" id="editCats">
          <button type="button" class="cat-pill" data-cat="Meat">Meat</button>
          <button type="button" class="cat-pill" data-cat="Veggies">Veggies</button>
          <button type="button" class="cat-pill" data-cat="Other">Other</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="edit-qty">Quantity (g)</label>
          <input type="number" id="edit-qty" inputmode="numeric" min="0">
        </div>
        <div class="field">
          <label for="edit-exp">Expiry</label>
          <input type="date" id="edit-exp">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-danger" id="delBtn">Delete</button>
        <div class="right">
          <button class="btn-secondary" id="cancelBtn">Cancel</button>
          <button class="btn-secondary" id="saveBtn" style="background: var(--accent); color: white;">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================================
    // CONFIG — paste your Apps Script /exec URL between the quotes:
    const API_URL = 'https://script.google.com/macros/s/AKfycbyLHAdfcd06myIFIm6X6dMk0Skqsk8QzCUDQpv7DkdV9EJXllwvFuWtWfMH59Wxv8Cm/exec';
    // ============================================================

    let items = [];
    let editingId = null;
    let sortMode = 'newest';
    let filterCat = 'all';
    let addCat = 'Other';
    let editCat = 'Other';

    const $ = id => document.getElementById(id);
    const toast = msg => {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    };

    function api(action, params) {
      const qs = new URLSearchParams(Object.assign({ action }, params || {})).toString();
      return fetch(API_URL + '?' + qs, { method: 'GET' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          if (!data.ok) throw new Error(data.error || 'Unknown error');
          return data;
        });
    }

    function checkConfig() {
      if (API_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE') !== -1 || !API_URL.startsWith('https://')) {
        $('content').innerHTML =
          '<div class="config-error"><strong>Setup needed.</strong> Open this HTML file in a text editor and replace ' +
          '<code>PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE</code> near the top of the <code>&lt;script&gt;</code> block with your ' +
          'Apps Script web app URL (the one ending in <code>/exec</code>). Then re-save and reload.</div>';
        return false;
      }
      return true;
    }

    function expiryStatus(dateStr) {
      if (!dateStr) return { label: '', cls: '' };
      const today = new Date(); today.setHours(0,0,0,0);
      const d = new Date(dateStr + 'T00:00:00');
      const diff = Math.round((d - today) / 86400000);
      if (diff < 0) return { label: 'Expired ' + Math.abs(diff) + 'd ago', cls: 'expired' };
      if (diff === 0) return { label: 'Expires today', cls: 'expiring' };
      if (diff === 1) return { label: 'Expires tomorrow', cls: 'expiring' };
      if (diff <= 3) return { label: 'Expires in ' + diff + 'd', cls: 'expiring' };
      return { label: 'Expires ' + dateStr, cls: '' };
    }

    function sortItems(arr) {
      const copy = arr.slice();
      if (sortMode === 'name') copy.sort((a,b) => a.name.localeCompare(b.name));
      else if (sortMode === 'quantity') copy.sort((a,b) => b.quantity - a.quantity);
      else if (sortMode === 'expiry') copy.sort((a,b) => {
        if (!a.expiry && !b.expiry) return 0;
        if (!a.expiry) return 1;
        if (!b.expiry) return -1;
        return a.expiry.localeCompare(b.expiry);
      });
      else copy.sort((a,b) => (b.added || '').localeCompare(a.added || ''));
      return copy;
    }

    function fmtQty(n) {
      if (n >= 1000) return (n/1000).toFixed(n % 1000 === 0 ? 0 : 1) + '<span>kg</span>';
      return n + '<span>g</span>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render() {
      const filtered = filterCat === 'all' ? items : items.filter(i => i.category === filterCat);
      const total = filtered.reduce((s, i) => s + (i.quantity || 0), 0);
      $('count').textContent = filtered.length;
      const totalDisplay = total >= 1000
        ? (total/1000).toFixed(total % 1000 === 0 ? 0 : 1) + ' kg'
        : total + ' g';
      $('totalLine').innerHTML = '<strong>' + totalDisplay.split(' ')[0] + '</strong> ' + totalDisplay.split(' ')[1] + ' total';

      const content = $('content');
      if (items.length === 0) {
        content.innerHTML = '<div class="empty"><div class="icon">∅</div><p>Your fridge is empty.</p><p style="font-size:13px">Add something above to get started.</p></div>';
        return;
      }
      if (filtered.length === 0) {
        content.innerHTML = '<div class="empty"><p>No ' + filterCat.toLowerCase() + ' items.</p></div>';
        return;
      }

      const sorted = sortItems(filtered);
      content.innerHTML = '<div class="items">' + sorted.map(it => {
        const exp = expiryStatus(it.expiry);
        const metaParts = [];
        metaParts.push('<span class="cat-tag cat-' + it.category + '">' + it.category + '</span>');
        if (it.added) metaParts.push('Added ' + it.added);
        if (exp.label) metaParts.push('<span class="expiry">' + exp.label + '</span>');
        const meta = metaParts.join(' <span class="dot"></span> ');
        return '<div class="item ' + exp.cls + '" data-id="' + it.id + '">' +
                 '<div class="item-main">' +
                   '<div class="item-name">' + escapeHtml(it.name) + '</div>' +
                   '<div class="item-meta">' + meta + '</div>' +
                 '</div>' +
                 '<div class="item-qty">' + fmtQty(it.quantity) + '</div>' +
                 '<div class="item-chev">›</div>' +
               '</div>';
      }).join('') + '</div>';

      document.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', () => openEdit(el.dataset.id));
      });
    }

    function setCatPills(container, value) {
      container.querySelectorAll('.cat-pill').forEach(pill => {
        pill.classList.toggle('active', pill.dataset.cat === value);
      });
    }

    function openEdit(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      $('edit-name').value = item.name;
      $('edit-qty').value = item.quantity;
      $('edit-exp').value = item.expiry || '';
      editCat = item.category || 'Other';
      setCatPills($('editCats'), editCat);
      $('modalBg').classList.add('open');
    }

    function closeModal() {
      editingId = null;
      $('modalBg').classList.remove('open');
    }

    function setBusy(busy) {
      $('addBtn').disabled = busy;
      $('addBtn').textContent = busy ? 'Adding…' : 'Add to fridge';
    }

    function handleAdd() {
      const name = $('name').value.trim();
      const qty = parseFloat($('qty').value);
      const exp = $('exp').value;
      if (!name) { toast('Name is required'); $('name').focus(); return; }
      if (!qty || qty <= 0) { toast('Quantity must be > 0'); $('qty').focus(); return; }
      setBusy(true);
      api('add', { name, quantity: qty, expiry: exp, category: addCat })
        .then(res => {
          items = res.items;
          $('name').value = '';
          $('qty').value = '';
          $('exp').value = '';
          addCat = 'Other';
          setCatPills($('addCats'), addCat);
          render();
          setBusy(false);
          if (res.merged) {
            toast('Added ' + res.addedQty + 'g to existing "' + res.mergedInto + '"');
          } else {
            toast('Added');
          }
          $('name').focus();
        })
        .catch(err => { setBusy(false); toast('Error: ' + err.message); });
    }

    function handleSave() {
      if (!editingId) return;
      const name = $('edit-name').value.trim();
      const qty = parseFloat($('edit-qty').value);
      const exp = $('edit-exp').value;
      if (!name || !qty || qty < 0) { toast('Check your inputs'); return; }
      api('update', { id: editingId, name, quantity: qty, expiry: exp, category: editCat })
        .then(res => { items = res.items; render(); closeModal(); toast('Saved'); })
        .catch(err => toast('Error: ' + err.message));
    }

    function handleDelete() {
      if (!editingId) return;
      if (!confirm('Delete this item?')) return;
      api('delete', { id: editingId })
        .then(res => { items = res.items; render(); closeModal(); toast('Deleted'); })
        .catch(err => toast('Error: ' + err.message));
    }

    function cycleSort() {
      const modes = ['newest', 'name', 'quantity', 'expiry'];
      const labels = { newest: 'newest', name: 'A–Z', quantity: 'quantity', expiry: 'expiry' };
      sortMode = modes[(modes.indexOf(sortMode) + 1) % modes.length];
      $('sortBtn').textContent = 'Sort: ' + labels[sortMode];
      render();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!checkConfig()) return;

      $('addBtn').addEventListener('click', handleAdd);
      $('saveBtn').addEventListener('click', handleSave);
      $('delBtn').addEventListener('click', handleDelete);
      $('cancelBtn').addEventListener('click', closeModal);
      $('sortBtn').addEventListener('click', cycleSort);
      $('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) closeModal(); });

      $('addCats').querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => { addCat = pill.dataset.cat; setCatPills($('addCats'), addCat); });
      });
      $('editCats').querySelectorAll('.cat-pill').forEach(pill => {
        pill.addEventListener('click', () => { editCat = pill.dataset.cat; setCatPills($('editCats'), editCat); });
      });
      $('filterRow').querySelectorAll('.filter-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          filterCat = pill.dataset.filter;
          $('filterRow').querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p === pill));
          render();
        });
      });
      ['name', 'qty', 'exp'].forEach(id => {
        $(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleAdd(); });
      });

      api('list')
        .then(res => { items = res.items; render(); })
        .catch(err => {
          $('content').innerHTML = '<div class="empty"><p>Couldn\'t load items.</p><p style="font-size:13px">' + escapeHtml(err.message) + '</p></div>';
        });
    });
  </script>
</body>
</html>
